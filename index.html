<body>

    <tr>
    <td colspan="4">
        <h3>INFORMAÇÕES</h3>
    </td>
    </tr>
    </table>
    <br><br>
    
    <div class="table">
        <table>
            <table border="1" cellpadding="10" cellspacing="0">
               <thead>
                  <tr>
                     <th>Nome</th>
                     <th>Idade</th>
                     <th>Hobby</th>
                  </tr>
               </thead>
               <tbody>
                  <tr>
                     <td>Lucas</td>
                     <td>14</td>
                     <td>Jogar Bola</td>
                  </tr>
                  <tr>
                    <td>Miguel</td>
                    <td>14</td>

                  <tr>
                    <td>Bernardo</td>

    <style>
        .table thead{
            color: brown;
        }
    </style>
    

    <style>
        .logo h2{
            color: rgb(41, 35, 134);

        }
    </style>

    <div class="logo">
        <h2>Formulário</h2>

    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <br><br>
        <input type="text" id="name" placeholder="Seu Nome Aqui.." required pattern="{2,}">
        <br><br>
        <label for="email" >E-mail:</label>
        <br><br>
        <input type="email" id="email" placeholder="Seu E-mail Aqui.." required pattern="{10,}">
        <br><br>
        <label for="senha">Senha:</label>
        <br><br>
        <input type="password" id="senha" placeholder="Sua Senha Aqui.." required>
        <br><br>
        <label for="cidade">Cidade:</label>
        <br><br>
        <select name="cidade" id="cidade">
            <option value="">Selecione</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="sl">São Paulo</option>
            <option value="cb">Rio de Janeiro</option>
            <option value="mgo">Montenegro</option>
        </select>
        <br><br>
        <label for="number">Telefone:</label>
        <br><br>
        <input type="tel" id="telefone" placeholder="(51) 99999 9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
        <br><br>
        <label for="cor">Cor Favorita:</label>
        <br><br>
        <input type="color" id="cor" value="3498db">
        <br><br>
        <button type="submit">ENVIAR</button>

    </form>
 
</body>
</html>
