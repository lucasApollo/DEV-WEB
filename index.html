<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>

</head>
<body>

    <style>
        .logo h3{
            color: rgb(41, 35, 134);
        }
    </style>

    <div class="logo">
        <h3>Cadastro Na GELEDAIRA</h3>
    </div>

    <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Seu Nome.." required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="seumail@email.com">
        <br><br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Sua Senha.." required>
        <br><br>
        <label for="mensagem">Mensagem:</label>
        <textarea name="mensagem" id="mensagem" cols="50" rows="4" placeholder="Escreva Aqui.."></textarea>
        <br><br>
        <label for="cidade">Cidade:</label>
        <select name="cidade" id="cidade">
            <option value="">Selecione</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="sl">São Leopoldo</option>
            <option value="cb">Campo Bom</option>
            <option value="mgo">Montenegro</option>
        </select>

    </form>

</body>
</html>
