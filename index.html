<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>

</head>
<body>

    <style>
        .aura h1{
            color: blue;
        }
    </style>

    <div class="aura">
        <h2>Login</h2>
        <h1>GELEDAIRA</h1>
    </div>
    

    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <br><br>
        <input type="text" id="nome" placeholder="Seu nome completo..">
        <br><br>
        <label for="email"> E-mail:</label>
        <br><br>
        <input type="email" id="email" placeholder="seugmail@email.com">
        <br><br>
        <label for="senha">Senha (min 6, só letras e números):</label>
        <br><br>
        <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required>
        <br><br>
        <label for="idade">Idade (13 a 99):</label>
        <br><br>
        <input type="number" id="idade" min="13" max="99" placeholder="Idade.." required>
        <br><br>
        <label for="data">Data (só em 2026):</label>
        <br><br>
        <input type="date" id="data" min="2026-01-01" max="2026-12-31">
        <br><br>
        <label for="number">Telefone:</label>
        <br><br>
        <input type="tel" id="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999 9999">
        <br><br>
        <label for="nota">Nota (0 a 10):</label>
        <br><br>
        <input type="range" id="nota" min="0" max="10" value="7">
        <br><br>
        <label for="cor">Cor favorita:</label>
        <br><br>
        <input type="color" id="cor" value="3498db">
        <br><br>
        <label for="codigo">Código (gerado automaticamente):</label>
        <br><br>
        <input type="text" id="codigo" value="ALU-2026-001" disabled>
        <br><br>
        
        <style>
            .auraa button{
                color: rgb(0, 68, 255);
            }
        </style>

        <div class="auraa">
            <button type="submit">Enviar</button>
        </div>
        

        
    </form>


</body>
</html>
