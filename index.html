<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>

</head>
<body>
 
     <h3>Formulário</h3>
     <form action="">
      <legend>Dados Pessoais</legend>
      <br><br>
      <label for="nome">Nome:</label>
      <br><br>
      <input type="text" id="nome" required placeholder="Digite Seu Nome:">
      <br><br>
      <label for="sobrenome">Sobrenome:</label>
      <br><br>
      <input type="text" id="sobrenome" required placeholder="Digite Seu Sobrenome">
      <br><br>
      <label for="idade">Idade:</label>
      <br><br>
      <input type="number" id="idade" required placeholder="Digite Sua Idade">
     </form>

</body>
</html>
