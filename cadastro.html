<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="topo">
        <h1>🎮 Game Store</h1>
        <hr>
        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#jogos">Jogos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>
    <main class="area-cadastro">
        <form id="formCadastro">
            <h2>Crie sua conta</h2>
            <p>Faça parte da comunidade Game Store!</p><br><br>
            <label for="nome">Nome completo:</label><br><br>
            <input type="text" id="nome" placeholder="Digite seu nome.." required><br><br>

            <label for="email">Email</label><br><br>
            <input type="email" id="email" placeholder="seu@gmail.com"><br><br>

            <label for="senha">Senha:</label><br><br>
            <input type="password" id="senha" placeholder="Crie uma senha" minlength="6" required><br><br>

            <label for="plataforma">Sua plataforma favorita:</label>
            <br><br>
            <select name="plataforma" required>
                <option value="">Selecione</option>
                <option value="PC">PC</option>
                <option value="Playstation">Playstation</option>
                <option value="Xbox">Xbox</option>
                <option value="Nintendo">Nintendo</option>
            </select>
            <br><br>
            <button type="submit" class="botao">
                Cadastrar
            </button>
            <p id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">
                Voltar a página inicial
            </a>
        </form>
    </main>
    <footer>
        <p class="direitos">&copy; 2026 Game Store - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
